<div class="auth-container">
    <mat-card class="auth-card">
        <!-- Form Section -->
        <div class="form-section">
            <mat-card-header>
                <mat-card-title>Create Account</mat-card-title>
                <mat-card-subtitle>Join us today</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
                <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Email</mat-label>
                        <input matInput formControlName="email" placeholder="anna@gmail.com">
                        <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                            Invalid email
                        </mat-error>
                        <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                            Email is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Password</mat-label>
                        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
                        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
                            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                        </button>
                        <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                            Must be at least 6 characters
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Role</mat-label>
                        <mat-select formControlName="role">
                            <mat-option value="user">User</mat-option>
                            <mat-option value="admin">Admin</mat-option>
                        </mat-select>
                    </mat-form-field>

                    <button mat-flat-button color="primary" type="submit" class="full-width"
                        [disabled]="!registerForm.valid">
                        Register
                    </button>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <div class="sign-up-text" (click)="signUpWithGoogle()">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                            class="google-icon">
                        <span>Sign up with Google</span>
                    </div>
                </form>
            </mat-card-content>
            <mat-card-actions align="end">
                <span class="signup-text">Already have an account? <a routerLink="/login">Log in</a></span>
            </mat-card-actions>
        </div>
    </mat-card>
</div>
