<div class="auth-wrapper reverse">
  
  <div class="auth-form-container" data-aos="fade-right" data-aos-duration="1000">
    <div class="form-wrapper">
      <div class="form-header">
        <h2>Create an account</h2>
        <p>Join us today to book faster</p>
      </div>
      
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="anna@gmail.com">
            <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                Invalid email
            </mat-error>
            <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                Email is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
                <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                Must be at least 6 characters
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role">
                <mat-option value="user">User</mat-option>
                <mat-option value="admin">Admin</mat-option>
            </mat-select>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="submit-btn full-width"
            [disabled]="!registerForm.valid">
            Create Account
        </button>

        <div class="divider">
            <span>or sign up with</span>
        </div>

        <div class="google-btn" (click)="signUpWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                class="google-icon">
            <span>Sign up with Google</span>
        </div>
      </form>

      <div class="footer-action">
          <span class="signup-text">Already have an account? <a routerLink="/login">Log in</a></span>
      </div>
    </div>
  </div>

  <div class="auth-graphic register-graphic" data-aos="fade-left" data-aos-duration="1000" data-aos-delay="200">
    <div class="graphic-content">
      <h1 class="graphic-title">Start your journey.</h1>
      <p class="graphic-subtitle">Fast, seamless, and completely tailored to your scheduling needs.</p>
      
      <div class="decorative-blob"></div>
      <div class="decorative-blob-2"></div>
    </div>
  </div>

</div>
