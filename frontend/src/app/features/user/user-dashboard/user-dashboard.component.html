<div class="user-container">

    <mat-toolbar color="primary">
        <span>Events</span>
        <span class="spacer"></span>
        <span style="margin-right: 16px; display: flex; align-items: center;">
            <mat-icon>account_balance_wallet</mat-icon>
            <span style="margin: 0 4px; font-weight: bold;">{{credits | number:'1.2-2'}}</span>
            <mat-icon>monetization_on</mat-icon>
        </span>
        <mat-form-field style="width: 100px; margin-right: 8px;">
            <input matInput type="number" [(ngModel)]="addAmount" min="1" placeholder="Add Coins">
        </mat-form-field>
        <button mat-raised-button color="accent" (click)="onAddCredits()">Add</button>
        <button mat-button (click)="logout()">Logout</button>
    </mat-toolbar>

    <div class="content">
        <h2>Upcoming Events</h2>
        <div class="events-grid">
            <mat-card *ngFor="let event of events" class="event-card">
                <mat-card-header>
                    <mat-card-title>{{event.name}}</mat-card-title>
                </mat-card-header>
                <mat-card-actions>
                    <button mat-raised-button color="accent" (click)="onBook(event.id)">Book Tickets</button>
                </mat-card-actions>
            </mat-card>
        </div>
    </div>
</div>
