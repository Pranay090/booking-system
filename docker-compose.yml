version: "3.9"

services:
  web:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - booking-network

  api:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASS: admin
      DB_NAME: booking
      REDIS_HOST: redis
      # CORS_ORIGIN is not strictly needed if proxying, but good to have
      CORS_ORIGIN: http://localhost
    depends_on:
      - postgres
      - redis
    networks:
      - booking-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    networks:
      - booking-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - booking-network

networks:
  booking-network:
    driver: bridge

volumes:
  pgdata:
